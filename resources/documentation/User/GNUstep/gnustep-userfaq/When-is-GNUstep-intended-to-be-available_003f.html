<h4 class="subsection" id="When-is-GNUstep-intended-to-be-available_003f-1"><span>1.1.9 When is GNUstep intended to be available?<a class="copiable-link" href="#When-is-GNUstep-intended-to-be-available_003f-1"> &para;</a></span></h4>

<p>It&rsquo;s usable now. Major releases are made about every six months. However, if
you are a serious developer, it&rsquo;s probably best to use the latest
snapshots.
