<H2><A NAME="SECTION00023000000000000000">
2.3 Setting the title of a window</A>
</H2>
To set the title of the window <TT>myWindow</TT>, you simply do
something like:
<PRE>
[myWindow setTitle: @"This is a test window"];
</PRE>
